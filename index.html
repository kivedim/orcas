<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Orcas &amp; Dinos</title>
<meta name="theme-color" content="#2bb3d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orcas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
/* Layout: one full-screen app, three "worlds" swapped in place. Single bright look by choice (toddler toy), not theme-aware. */
:root{
  --sky:#9fe3ff; --sea:#2bb3d8; --deep:#0c4f7e; --sand:#f3cf86;
  --leaf:#63c46a; --cream:#fff6e2; --ink:#22314d; --sun:#ffcf3f;
  --display:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden}
.art{display:block;width:100%;height:auto;overflow:visible}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:4px;border-radius:50%}

/* ---------- Home ---------- */
#home{background:linear-gradient(var(--sky) 0 26%,var(--sea) 26%,var(--deep) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#home .sun{position:absolute;top:4%;right:8%;width:16vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a88}
#home .wave{position:absolute;left:0;right:0;top:calc(26% - 3vmin);height:6vmin;
  background:radial-gradient(circle at 50% 0,var(--sky) 3vmin,transparent 3.1vmin) 0 0/6vmin 6vmin repeat-x}
#home h1{position:relative;margin:0;font-weight:800;font-size:clamp(30px,8.5vmin,64px);color:#fff;letter-spacing:.01em;
  text-shadow:0 4px 0 var(--deep);line-height:1;text-wrap:balance;text-align:center}
.worlds{position:relative;display:flex;flex-direction:column;gap:2.6vh;align-items:center}
@media (orientation:landscape){.worlds{flex-direction:row;gap:4vw}}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:repeat(4,auto);gap:3vw}
.world{display:block;border-radius:50%}
.world .disc{position:relative;width:min(20vw,13vh);aspect-ratio:1;border-radius:50%;background:var(--cream);border:1.2vmin solid #fff;
  box-shadow:0 1vmin 0 #0003;display:grid;place-items:center;transition:transform .15s;overflow:hidden}
.world:active .disc{transform:scale(.92)}
.world .disc > svg{width:74%}
.row .world:nth-child(1) .disc{background:#e6f7d9}
.row .world:nth-child(2) .disc{background:#cdeefa}
.row .world:nth-child(3) .disc{background:#fff0d6}
.row .world:nth-child(4) .disc{background:#efe4ff}
.world.hero .disc{width:min(58vw,30vh);background:#cdeefa;animation:pulse 2.4s infinite}
.world.hero .disc > svg{width:84%}
.ic{position:absolute;pointer-events:none}
.mascot{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:22px;width:min(26vw,15vh);transform-origin:50% 100%;animation:mascot 3s ease-in-out infinite}
.mascot svg{display:block;width:100%;height:auto}
@keyframes mascot{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3%)}}
.ver{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:6px;color:#ffffffb3;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.gear{position:absolute;bottom:14px;right:max(14px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;touch-action:none}
.gear > svg.g{width:26px}
.hring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none}
.hring circle{fill:none;stroke:var(--sun);stroke-width:5;stroke-linecap:round;stroke-dasharray:182;stroke-dashoffset:182}

.homebtn{position:absolute;z-index:50;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:58px;height:58px;border-radius:50%;
  background:#fff;box-shadow:0 4px 0 #0002;display:grid;place-items:center;touch-action:none}
.homebtn > svg.h{width:32px}
.homebtn.nudge{animation:wiggle .4s}

/* ---------- Parent settings ---------- */
.parent{position:absolute;inset:0;z-index:90;background:#0b2d4acc;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.pcard{width:min(100%,460px);max-height:100%;overflow:auto;background:#fff;color:var(--ink);border-radius:22px;padding:18px 18px 12px;box-shadow:0 10px 30px #0005}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.phead h2{margin:0;font-size:22px;font-weight:800}
.pdone{background:var(--sea);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px}
.prow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #e6edf3;font-weight:600;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#eef3f7;border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:#4b5b70}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.pbtn{padding:7px 14px;border-radius:999px;background:#ffe3e3;color:#a32525;font-weight:700;font-size:14px}
.pnote{margin:10px 0 0;font-size:12px;color:#6b7a8c;line-height:1.4}

/* ---------- Album ---------- */
#album{background:linear-gradient(#efe4ff,#d9ecff);overflow-y:auto;-webkit-overflow-scrolling:touch}
.alb{padding:84px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.alb-count{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;
  padding:4px 14px 4px 6px;font-weight:800;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #0001}
.alb-count svg{width:28px}
.alb h3{display:flex;align-items:center;gap:8px;margin:18px 4px 10px;font-size:18px;font-weight:800;color:#3d4a7a}
.alb h3 svg{width:28px}
.alb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(26vw,110px),1fr));gap:12px}
.stk{position:relative;aspect-ratio:1;border-radius:22%;background:#fff;box-shadow:0 4px 0 #0000001a;display:grid;place-items:center;cursor:pointer}
.stk > div{width:84%}
.stk.no{background:#ffffff80}
.stk.no > div{filter:brightness(0);opacity:.13}
.stk.no::after{content:"?";position:absolute;font-weight:800;font-size:clamp(22px,7vmin,36px);color:#8f86c4}
.stk.wig > div{animation:wiggle .5s}
.toast{position:absolute;left:50%;top:12px;z-index:80;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;
  box-shadow:0 4px 0 #0002;font-weight:800;font-size:17px;color:var(--ink);transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.toast > div{width:46px}

/* ---------- Hint hand ---------- */
.hand{position:absolute;z-index:85;width:56px;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 4px #0004)}
.hand svg{display:block;width:100%}
.tapdot{position:absolute;z-index:84;width:44px;height:44px;margin:-22px;border-radius:50%;border:4px solid #fff;pointer-events:none;animation:ring 0.9s ease-out forwards}
.tray.four .slot{width:min(21vw,13.5vh)}
.tray.two .slot{width:min(30vw,18vh)}

/* ---------- Egg ---------- */
#egg{touch-action:none;background:linear-gradient(#bdf0ff 0,#dff8e2 45%,#9bdc8c 45%,#6cbb5f 100%)}
#egg .hill{position:absolute;bottom:52%;width:70%;aspect-ratio:2;border-radius:50% 50% 0 0;background:#8fd27c}
#egg .hill.a{left:-15%}#egg .hill.b{right:-20%;width:80%;background:#7cc86c}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,46vh);aspect-ratio:1}
.nest{position:absolute;left:0;right:0;bottom:0}
.eggbox{position:absolute;left:22%;width:56%;bottom:16%;transform-origin:50% 90%;touch-action:none}
.eggbox.wob{animation:wob .45s}
.crack{opacity:0;transition:opacity .1s}
.dino{position:absolute;left:4%;width:92%;bottom:14%;transform-origin:50% 100%}
.dino.pop{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
.dino.jump{animation:jump .55s}
.shell{pointer-events:none;position:absolute;left:50%;top:55%;width:16%;aspect-ratio:1;clip-path:polygon(50% 0,100% 100%,0 80%);
  animation:fly .9s ease-out forwards}
.again{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:19%;width:min(22vw,13vh);animation:pulse 1.2s infinite}
.shelf{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:2vw;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shelf > div{width:min(14vw,9vh);animation:popin .5s both}

/* ---------- Memory (hide & seek pairs) ---------- */
#hide .pow,#hide .spark,#hide .mbub{z-index:999}
#hide{isolation:isolate;background:linear-gradient(#86def6 0,#3fb3dc 24%,#1f86ba 40%,#1f86ba 100%)}
.ray{pointer-events:none;position:absolute;top:-10%;width:18%;height:62%;background:linear-gradient(#ffffff40,transparent);transform:rotate(18deg);transform-origin:top}
.bubble{pointer-events:none;position:absolute;bottom:-5%;z-index:60;border-radius:50%;border:2px solid #ffffffaa;background:#ffffff22;animation:rise linear infinite}
.floor{position:absolute;left:-15%;right:-15%;top:38%;bottom:-4%;pointer-events:none;border-radius:50% 50% 0 0/9% 9% 0 0;
  background:linear-gradient(#7fb8c2 0,#c9c08f 14%,#e7cd8c 45%,#f3d48c 100%)}
.floor::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 30% 4% at 30% 40%,#ffffff30,transparent),radial-gradient(ellipse 25% 3% at 70% 62%,#ffffff2a,transparent),radial-gradient(ellipse 34% 4% at 40% 84%,#ffffff26,transparent)}
.far{position:absolute;left:0;right:0;top:calc(38% - 64px);height:80px;pointer-events:none}
.swimmer{position:absolute;left:0;width:46px;opacity:.38;pointer-events:none;animation:swimby linear infinite}
.swimmer.rev{animation-name:swimback}
.spot{position:absolute;touch-action:none;cursor:pointer}
.spot::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:14%;border-radius:50%;background:radial-gradient(closest-side,#0000002e,transparent);z-index:0}
.spot .cover{position:absolute;inset:0;z-index:2;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1);
  filter:saturate(calc(.62 + .38 * var(--k,1))) brightness(calc(1.14 - .14 * var(--k,1)))}
.spot .cover.sway svg{transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
.spot .creature{position:absolute;left:8%;width:84%;bottom:22%;z-index:1;opacity:0;transform:translateY(20%) scale(.3);
  transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .18s;pointer-events:none}
.spot.open .creature{opacity:1;transform:translateY(-56%) scale(1)}
.spot.open .cover{transform:translateX(24%) rotate(10deg)}
.spot.matched .cover{transform:translateX(28%) rotate(13deg) scale(.92)}
.spot .tag{position:absolute;left:50%;top:-70%;z-index:5;transform:translate(-50%,8px) scale(.6);opacity:0;white-space:nowrap;pointer-events:none;
  background:#fff;color:var(--ink);font-weight:800;font-size:clamp(13px,3.8vmin,19px);line-height:1;padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 #0003;
  transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.spot.open .tag{opacity:1;transform:translate(-50%,0) scale(1)}
.spot.open{z-index:400 !important}
.spot.matched .creature .bob{animation:bob 1.6s ease-in-out infinite}
.creature.wiggle .bob{animation:wiggle .5s !important}
.lvl{position:absolute;top:30px;right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:70}
.lvl i{width:16px;height:16px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
.lvl i.on{background:var(--sun)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swimby{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
@keyframes swimback{from{transform:translateX(calc(100vw + 80px)) scaleX(-1)}to{transform:translateX(-80px) scaleX(-1)}}

/* ---------- Feed ---------- */
#feed{background:#0c4f7e}
.fworld{position:absolute;left:0;right:0;top:0;height:300%;transition:transform 1.3s cubic-bezier(.6,0,.3,1);pointer-events:none;
  background:linear-gradient(#4fa8ea 0%,#86cff6 16%,#bfeeff 33.3%,#e8f8ff 47.3%,#a5df92 48.27%,#79c46a 62.67%,#e9cf8f 63.73%,#f3d48c 65.6%,#9fe2f7 65.6%,#5cc3e8 66.67%,#2c9fd0 70.7%,#1c7fb4 84%,#0c4f7e 100%)}
.fworld.instant{transition:none}
.fsun{position:absolute;top:35.4%;right:10%;width:15vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a77}
.fcloud{position:absolute;width:24vmin;height:7vmin;border-radius:999px;background:#fff;opacity:.92}
.fcloud::before{content:"";position:absolute;left:18%;top:-55%;width:42%;aspect-ratio:1;border-radius:50%;background:#fff}
.fcloud::after{content:"";position:absolute;left:48%;top:-35%;width:32%;aspect-ratio:1;border-radius:50%;background:#fff}
.frainbow{position:absolute;left:8%;top:8%;width:84%;aspect-ratio:2/1;border-radius:999px 999px 0 0;opacity:.45;
  background:radial-gradient(circle at 50% 100%,transparent 52%,#a78bfa 52% 56%,#60a5fa 56% 60%,#4ade80 60% 64%,#facc15 64% 68%,#fb923c 68% 72%,#f87171 72% 76%,transparent 76%)}
.fbirds{position:absolute;left:58%;top:22%;width:22%;height:2%;opacity:.5}
.fhills{position:absolute;left:0;width:100%;top:45.47%;height:2.93%}
.fgrass{position:absolute;left:0;width:100%;top:53.33%;height:8%}
.fray{position:absolute;top:66.67%;width:14%;height:16%;background:linear-gradient(#ffffff38,transparent);transform:skewX(-14deg)}
.fweed{position:absolute;left:0;width:100%;bottom:0;height:4.67%}
.fbub{position:absolute;border-radius:50%;border:2px solid #ffffff99;background:#ffffff22}
.animal.air .inner{animation:hover 1.8s ease-in-out infinite}
.animal .wing{transform-box:view-box;animation:flap .5s ease-in-out infinite alternate}
.animal .wing.w2{animation-delay:-.08s}
.animal .inner.fly .wing{animation-duration:.24s}
.animal .inner.fly{animation:fly .5s ease-in-out infinite}
@keyframes flapR{from{transform:rotate(-12deg)}to{transform:rotate(24deg) scaleY(.82)}}
.animal .wing.wr{animation-name:flapR}
@keyframes flap{from{transform:rotate(12deg)}to{transform:rotate(-24deg) scaleY(.82)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
.animal{position:absolute;left:50%;top:44%;width:min(92vw,52vh);transform:translate(-50%,-50%);touch-action:none;z-index:4}
.animal .inner{transform-origin:50% 85%;transition:transform .2s}
.animal .inner.walk{animation:walk .34s ease-in-out infinite}
.animal .inner.swim{animation:swim .9s ease-in-out infinite}
.animal.chomp .inner{animation:chomp .3s 2}
.animal.nope .inner{animation:nope .6s}
.animal.glad .inner{animation:jump .6s 2}
.animal.eager .inner{transform:scale(1.07) rotate(-3deg)}
.yuckface,.animal .sadface,.animal .gladface{opacity:0;transition:opacity .1s}
.animal.yuck .yuckface,.animal.glad .gladface,.animal.eager .gladface{opacity:1}
.fedcount{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));z-index:6;display:flex;align-items:center;gap:6px;
  background:#ffffffd9;border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.fedcount svg{width:30px}
.fedcount.bump{animation:popin .45s cubic-bezier(.3,1.8,.5,1)}
.tray{position:absolute;left:0;right:0;bottom:max(18px,3vh);z-index:5;display:flex;justify-content:center;gap:min(4vw,22px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slot{position:relative;width:min(27vw,16vh);aspect-ratio:1;display:grid;place-items:center;background:#ffffffe6;border-radius:28%;
  box-shadow:0 6px 0 #0002,inset 0 -6px 0 #0000000d;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;transition:transform .35s,opacity .35s}
.slot.out{transform:scale(0);opacity:0}
.slot.hint{animation:pulse .7s 4}
.food{width:80%;touch-action:none;cursor:grab;animation:fbob 2.4s ease-in-out infinite;will-change:transform}
.food > svg{display:block;pointer-events:none}
.food.drag{animation:none;filter:drop-shadow(0 12px 8px #0004);cursor:grabbing}
.crumb{position:absolute;z-index:14;width:10px;height:10px;margin:-5px;border-radius:50%;pointer-events:none;animation:spark .7s ease-out forwards}
.pow.yuk{color:#9be15d}
.float{position:absolute;z-index:40;width:40px;pointer-events:none;animation:floatup 1.4s ease-out forwards}
@keyframes nope{15%{transform:rotate(-7deg) translateX(-5%)}35%{transform:rotate(6deg) translateX(5%)}55%{transform:rotate(-5deg) translateX(-3%)}75%{transform:rotate(3deg) translateX(2%)}}
@keyframes hopmove{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.9)}55%{transform:translateY(-16%) scale(.96,1.05)}}
.animal .inner.hop{animation:hopmove .38s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-5%) rotate(2.5deg)}}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(5%) rotate(4deg)}}
@keyframes fbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7%) rotate(4deg)}}

/* ---------- Orca Ocean ---------- */
#orca{background:linear-gradient(#a9e2ff 0,#e6f7ff 30%,#3ab4dc 30%,#1574a6 62%,#0a3a60 100%);touch-action:none}
.o-sun{position:absolute;top:5%;left:12%;width:13vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a77;pointer-events:none}
.o-mtn{position:absolute;left:-4%;width:64%;bottom:70%;pointer-events:none}
.o-berg{position:absolute;right:5%;width:min(30vw,210px);top:calc(30% - .4 * min(30vw,210px));pointer-events:none}
.o-waves{position:absolute;left:0;right:0;top:calc(30% - 1px);height:14px;pointer-events:none;
  background:radial-gradient(circle at 50% 0,#e6f7ff 9px,transparent 9.5px) 0 0/26px 14px repeat-x;animation:wave 4s linear infinite}
.o-ray{position:absolute;top:30%;width:14%;height:45%;background:linear-gradient(#ffffff38,transparent);transform:skewX(-14deg);pointer-events:none}
.o-floor{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none}
.orca-ent{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none}
.fishy{position:absolute;left:0;top:0;width:44px;pointer-events:none;will-change:transform}
.fishy.ping{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ffe066)}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:4px solid #ffffffcc;border-radius:50%;pointer-events:none;animation:ring 1s ease-out forwards}
.drop{position:absolute;width:13px;height:13px;margin:-6px;border-radius:50%;background:#effcff;pointer-events:none;animation:drop .9s ease-out forwards}
.puff{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;background:#fff;opacity:.95;pointer-events:none;animation:puff 1.3s ease-out forwards}
.o-actions{position:absolute;left:0;right:0;bottom:12px;z-index:20;display:flex;justify-content:center;gap:min(2vw,10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act{width:min(13.5vw,66px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0003;display:grid;place-items:center;transition:transform .12s}
.act:active{transform:scale(.88)}
.act svg{width:70%}
.o-count{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));z-index:20;display:flex;gap:3px}
.o-count div{width:34px;opacity:.35;transition:opacity .2s,transform .3s}
.o-count div.on{opacity:1;transform:scale(1.15)}
.caption{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(88%,520px);z-index:20;
  background:#ffffffeb;color:var(--ink);font-weight:600;font-size:clamp(15px,3.4vmin,20px);line-height:1.3;padding:8px 16px;border-radius:18px;
  text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
.caption.show{opacity:1}
.gw{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none}
.stars{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;animation:spin 1s linear infinite}
.stars svg{position:absolute;width:22px}
.act.shark{background:#ffe1e1}
.pow{position:absolute;z-index:15;pointer-events:none;font-family:var(--display);font-weight:800;line-height:1;white-space:nowrap;
  font-size:clamp(28px,8vmin,50px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:pow .95s ease-out forwards}
.pow.big{font-size:clamp(42px,12vmin,84px);color:#ffd93d;animation-duration:1.6s}
.pow.zz{font-size:clamp(20px,5vmin,30px);color:#cfe9ff;-webkit-text-stroke:4px var(--ink);animation:zz 1.4s ease-out forwards}
.boom{position:absolute;z-index:14;width:140px;height:140px;margin:-70px;pointer-events:none;animation:boom .55s ease-out forwards}
.spark{position:absolute;z-index:14;width:20px;margin:-10px;pointer-events:none;animation:spark .75s ease-out forwards}
.mbub{position:absolute;z-index:13;margin:-6px;border-radius:50%;border:2px solid #fff;background:#ffffff44;pointer-events:none;animation:mbub 1s ease-out forwards}
#oLayer.shake{animation:shake .38s}
.gw.flash{filter:brightness(2.4) saturate(.2)}
.o-count div.bump{animation:popin .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg)}55%{transform:translate(-50%,-65%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-115%) scale(.9);opacity:0}}
@keyframes zz{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(10%,-260%) scale(1.2) rotate(15deg);opacity:0}}
@keyframes boom{0%{transform:scale(.15) rotate(0);opacity:1}60%{opacity:1}100%{transform:scale(1.5) rotate(30deg);opacity:0}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
@keyframes mbub{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.shp{position:absolute;left:0;top:0;z-index:12;display:flex;gap:2px;transform:translate(-50%,-50%);pointer-events:none}
.shp svg{width:22px}
.shp.bump{animation:popin .4s cubic-bezier(.3,1.8,.5,1)}
.pow.grr{color:#ff5d5d;font-size:clamp(22px,6vmin,36px)}
.pow.ouch{color:#ff8fa3}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}
@keyframes drop{50%{transform:translate(calc(var(--dx) * .5),var(--dy))}100%{transform:translate(var(--dx),24px);opacity:0}}
@keyframes puff{to{transform:translate(var(--dx),-110px) scale(2.6);opacity:0}}
@keyframes wave{to{background-position-x:26px}}

#egg.shk,#feed.shk{animation:shake .38s}
.dino .sadface,.dino .gladface{opacity:0;transition:opacity .12s}
.dino.sad .sadface,.dino.cry .sadface,.dino.glad .gladface{opacity:1}
.dino:not(.cry) .tear,.dino:not(.cry) .cryonly,.dino.cry .sadonly{visibility:hidden}
.tear{transform-box:fill-box;animation:tear 1s ease-in infinite}
.tear.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18%) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rise{to{transform:translateY(-115vh)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
@keyframes chomp{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.9)}}
@keyframes enter{from{transform:translate(80vw,-50%)}to{transform:translate(-50%,-50%)}}
@keyframes leave{to{transform:translate(-160vw,-50%)}}
@keyframes floatup{0%{transform:scale(.4);opacity:1}100%{transform:translateY(-30vh) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-iteration-count:1 !important;transition-duration:.01s !important}
 .world.hero .disc,.again,.o-waves,#oLayer.shake,#egg.shk,.tear,.stars,.food,.mascot,.animal .wing,.animal.air .inner,.animal .inner.fly,.animal .inner.walk,.animal .inner.hop,.animal .inner.swim,.spot.matched .creature .bob,.spot .cover.sway svg,.swimmer{animation:none !important}}
</style>
</head>
<body>

<div id="app">
  <!-- HOME -->
  <section class="screen" id="home">
    <div class="sun"></div><div class="wave"></div>
    <h1>Orcas &amp; Dinos</h1>

        <button class="world" data-go="feed" aria-label="Feed the animals"><span class="disc" id="iconFeed"></span></button>
        <button class="world" data-go="album" aria-label="Sticker album"><span class="disc" id="iconAlbum"></span></button>
      </div>
    </div>
    <div class="mascot" id="mascot" role="button" aria-label="Bibbi-Cat"></div>
    <div class="ver" id="ver"></div>
    <button class="gear" id="gear" aria-label="Parent settings (hold)"><svg class="g" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9-.4a6.9 6.9 0 0 1-.6 1.5l1.1 1.6-1.6 1.6-1.6-1.1a6.9 6.9 0 0 1-1.5.6l-.4 1.9h-2.2l-.4-1.9a6.9 6.9 0 0 1-1.5-.6l-1.6 1.1-1.6-1.6 1.1-1.6a6.9 6.9 0 0 1-.6-1.5l-1.9-.4v-2.2l1.9-.4c.1-.5.3-1 .6-1.5L4.4 6.9 6 5.3l1.6 1.1c.5-.3 1-.5 1.5-.6l.4-1.9h2.2l.4 1.9c.5.1 1 .3 1.5.6L15.2 5.3l1.6 1.6-1.1 1.6c.3.5.5 1 .6 1.5l1.9.4Z" fill="#fff"/></svg><svg class="hring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/></svg></button>
  </section>

  <!-- ALBUM -->
  <section class="screen" id="album" hidden>
    <div class="alb-count" id="albCount"></div>
    <div class="alb" id="alb"></div>
  </section>

  <!-- EGG -->
  <section class="screen" id="egg" hidden>
    <div class="hill a"></div><div class="hill b"></div>
    <div class="stage">
      <div class="nest" id="nest"></div>
      <div class="eggbox" id="eggbox"></div>
      <div class="dino" id="dino" hidden></div>
    </div>
    <button class="again" id="again" hidden aria-label="New egg"></button>
    <div class="shelf" id="shelf"></div>
    <div class="caption" id="eggCap"></div>
  </section>

  <!-- MEMORY -->
  <section class="screen" id="hide" hidden>
    <div class="ray" style="left:8%"></div><div class="ray" style="left:46%;width:12%"></div><div class="ray" style="left:74%"></div>
    <div class="lvl" id="lvl"></div>
    <div id="reef"></div>
  </section>

  <!-- FEED -->
  <section class="screen" id="feed" hidden>
    <div class="fworld instant" id="fworld">
      <div class="frainbow"></div>
      <div class="fcloud" style="top:3%;left:6%;transform:scale(1.3)"></div><div class="fcloud" style="top:11%;left:60%"></div><div class="fcloud" style="top:20%;left:20%;transform:scale(.8)"></div><div class="fcloud" style="top:27%;left:66%;transform:scale(1.1)"></div>
      <svg class="fbirds" viewBox="0 0 100 20"><g stroke="#2a5d80" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M2 10 Q8 2 14 10 Q20 2 26 10"/><path d="M40 16 Q45 9 50 16 Q55 9 60 16"/><path d="M72 6 Q77 0 82 6 Q87 0 92 6"/></g></svg>
      <div class="fsun"></div><div class="fcloud" style="top:36%;left:8%"></div><div class="fcloud" style="top:38.7%;left:56%;transform:scale(.7)"></div>
      <svg class="fhills" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 60 Q60 8 130 38 Q200 0 270 34 Q340 12 400 38 V60Z" fill="#b9e6aa"/></svg>
      <svg class="fgrass" viewBox="0 0 400 100" preserveAspectRatio="none"><g fill="#6bb85d">
        <path d="M20 100 L26 70 L32 100Z M34 100 L42 64 L48 100Z M330 100 L338 66 L344 100Z M346 100 L352 74 L358 100Z"/></g>
        <g fill="#ff8fc8"><circle cx="90" cy="40" r="5"/><circle cx="300" cy="30" r="5"/></g><g fill="#ffd93d"><circle cx="90" cy="40" r="2"/><circle cx="300" cy="30" r="2"/><circle cx="200" cy="70" r="4"/></g></svg>
      <div class="fray" style="left:10%"></div><div class="fray" style="left:48%;width:9%"></div><div class="fray" style="left:76%"></div>
      <div class="fbub" style="left:14%;top:74.7%;width:14px;height:14px"></div><div class="fbub" style="left:82%;top:80%;width:20px;height:20px"></div><div class="fbub" style="left:60%;top:89.3%;width:12px;height:12px"></div>
      <svg class="fweed" viewBox="0 0 400 60" preserveAspectRatio="none"><g fill="#2f9a5b"><path d="M20 60 Q8 30 26 0 Q30 30 34 60Z"/><path d="M40 60 Q50 34 38 10 Q60 30 52 60Z"/><path d="M350 60 Q340 30 356 4 Q362 30 366 60Z"/><path d="M372 60 Q382 36 372 16 Q392 34 384 60Z"/></g></svg>
    </div>
    <div class="animal" id="animal"><div class="inner" id="animalInner"></div></div>
    <div class="fedcount" id="fedcount"></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- ORCA OCEAN -->
  <section class="screen" id="orca" hidden>
    <div class="o-sun"></div>
    <svg class="o-mtn" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M0 70 L40 22 L62 40 L96 6 L130 44 L160 26 L200 70Z" fill="#9ccbe0"/><path d="M96 6 L82 24 L92 22 L100 28 L108 20Z M40 22 L33 31 L44 29Z" fill="#fff"/></svg>
    <svg class="o-berg" viewBox="0 0 200 160"><path d="M30 80 L60 34 L84 46 L110 10 L150 52 L172 80Z" fill="#fff"/><path d="M110 10 L104 80 L172 80 L150 52Z" fill="#dcf1fb"/><path d="M24 80 L176 80 L150 140 L60 150Z" fill="#cdeefa" opacity=".45"/></svg>
    <div class="o-ray" style="left:10%"></div><div class="o-ray" style="left:48%;width:9%"></div><div class="o-ray" style="left:76%"></div>

      <path d="M0 50 Q60 36 120 48 T240 44 T400 46 V90 H0Z" fill="#d9b874"/>
      <g fill="#2f9a5b"><path d="M30 52 Q20 30 34 10 Q42 30 38 52Z"/><path d="M46 52 Q52 28 42 4 Q60 26 54 52Z"/><path d="M330 48 Q318 24 334 2 Q342 26 340 48Z"/><path d="M348 48 Q356 30 350 12 Q366 30 358 48Z"/></g>
      <ellipse cx="200" cy="54" rx="30" ry="12" fill="#7d84a6"/><ellipse cx="270" cy="56" rx="16" ry="8" fill="#8a7fa8"/>
    </svg>

    <div class="o-count" id="oCount"></div>

      <button class="act" data-act="slap" aria-label="Tail slap"><svg viewBox="0 0 48 48"><path d="M24 36 V24" stroke="#1d2433" stroke-width="6" stroke-linecap="round"/><path d="M24 26 Q12 22 4 8 Q16 12 24 20 Q32 12 44 8 Q36 22 24 26Z" fill="#1d2433"/><path d="M2 40 H46" stroke="#2aa5d4" stroke-width="4" stroke-linecap="round"/><circle cx="8" cy="34" r="2.5" fill="#2aa5d4"/><circle cx="40" cy="33" r="2.5" fill="#2aa5d4"/><circle cx="12" cy="28" r="2" fill="#2aa5d4"/></svg></button>

  <button class="homebtn" id="homebtn" hidden aria-label="Home">

</div>

octopus:()=>`<svg class="art" viewBox="0 0 160 160">
 ${[30,52,80,108,130].map((x,i)=>`<path d="M${80+(x-80)*.5} 92 Q${x-8} 120 ${x} 136 Q${x+10} 152 ${x-6} 156" stroke="#b56be0" stroke-width="16" fill="none" stroke-linecap="round"/>`).join('')}
 <ellipse cx="80" cy="64" rx="50" ry="46" fill="#c47cf0"/>
 <circle cx="58" cy="40" r="8" fill="#dfb3ff"/><circle cx="104" cy="34" r="5" fill="#dfb3ff"/>

/* actions: fn(p) moves e; return {a} for an explicit angle */
function makeAct(name,e){const x0=e.x,y0=e.y,a0=e.a,W=OW.W,H=OW.H,S=()=>OW.surf;const once={};const fire=(k,f)=>{if(!once[k]){once[k]=1;f()}};
 if(name==='jump'){let d=e.dir;if(x0+d*W*.42>W-e.w*.45||x0+d*W*.42<e.w*.45)d=-d;e.dir=d;const xa=x0+d*W*.08,run=W*.32,hg=Math.min(H*.22,S()*.8);
  return{dur:1.9,fn:p=>{if(p<.3){const q=ease(p/.3);e.x=lerp(x0,xa,q);e.y=lerp(y0,S()+e.h*.2,q)}
   else{const q=(p-.3)/.7;e.x=xa+d*run*q;e.y=S()+e.h*.2-(hg+e.h*.2)*4*q*(1-q)+e.h*.9*q*q;
    if(q>.04)fire('s1',()=>splash(e.x,.6));if(q>.82)fire('s2',()=>{splash(e.x,1.3);sfx.splash()})}}}}
 if(name==='spyhop')return{dur:3,fn:p=>{let a;
  if(p<.25){const q=ease(p/.25);e.y=lerp(y0,S()+e.w*.5,q);a=lerp(a0,-86,q)}
  else if(p<.4){const q=ease((p-.25)/.15);e.y=lerp(S()+e.w*.5,S()+e.w*.1,q);a=-86;fire('s',()=>{splash(e.x,.5);sfx.bubble()})}
  else if(p<.75){e.y=S()+e.w*.1+Math.sin((p-.4)*30)*3;a=-86+Math.sin((p-.4)*14)*5}
  else{const q=ease((p-.75)/.25);e.y=lerp(S()+e.w*.1,S()+e.h*.9,q);a=lerp(-86,0,q)}return{a}}};
 if(name==='blow')return{dur:2.1,fn:p=>{let a=0;
  if(p<.3){const q=ease(p/.3);e.y=lerp(y0,S()+e.h*.18,q);a=lerp(a0,0,q)}
  else if(p<.8){e.y=S()+e.h*.18;fire('b',()=>{const [bx,by]=pt(e,e.w*.14,-e.h*.28);puffs(bx,by);sfx.blow()})}
  else{e.y=lerp(S()+e.h*.18,S()+e.h*.7,ease((p-.8)/.2))}return{a}}};
 if(name==='slap'){const slamAt=(k,p0)=>{};return{dur:2.4,fn:p=>{let a;
  if(p<.25){const q=ease(p/.25);e.y=lerp(y0,S()+e.h*.3,q);a=lerp(a0,0,q)}
  else if(p<.45)a=lerp(0,62,ease((p-.25)/.2));
  else if(p<.52){a=lerp(62,6,(p-.45)/.07)}
  else if(p<.55){a=6;fire('t1',()=>{const [tx]=pt(e,-e.w*.46,0);splash(tx,1);sfx.splash();slapHit(e,tx)})}
  else if(p<.72)a=lerp(6,62,ease((p-.55)/.17));
  else if(p<.79)a=lerp(62,6,(p-.72)/.07);
  else if(p<.85){a=6;fire('t2',()=>{const [tx]=pt(e,-e.w*.46,0);splash(tx,1.1);sfx.splash();slapHit(e,tx)})}
  else{a=lerp(6,0,(p-.85)/.15);e.y=lerp(S()+e.h*.3,S()+e.h*.7,ease((p-.85)/.15))}
  if(p>=.25)e.y=p<.85?S()+e.h*.3:e.y;return{a}}}}
 if(name==='sonar')return{dur:1.5,fn:p=>{const [hx,hy]=pt(e,e.w*.44,e.h*.05);
  fire('r',()=>{ring(hx,hy,0);ring(hx,hy,350);ring(hx,hy,700);sfx.click();setTimeout(sfx.click,500)});
  if(p>.9)fire('f',()=>{if(OW.shark&&OW.shark.state==='hunt'){OW.chase=OW.shark;return}let best=null,bd=1e9;OW.fish.forEach(f=>{if(!f.alive)return;const d=Math.hypot(f.x-e.x,f.y-e.y);if(d<bd){bd=d;best=f}});
   if(best){best.el.classList.add('ping');OW.chase=best}});return{a:e.a}}};
}

 if(name!=='sonar')OW.ents.filter(f=>f!==P).forEach((f,i)=>setTimeout(()=>{if(OW.run&&!f.act){f.act=makeAct(name,f);f.act.t=0}},380*(i+1)));

function oLoop(now){if(!OW.run)return;const dt=Math.min(.05,(now-OW.last)/1000);OW.last=now;OW.time+=dt;const P=OW.P,W=OW.W;
 for(const e of OW.ents){
  if(e.act){e.act.t+=dt;const p=Math.min(1,e.act.t/e.act.dur),px=e.x,py=e.y,res=e.act.fn(p);
   if(res&&res.a!==undefined)e.a=res.a;else{const vx=(e.x-px)/dt,vy=(e.y-py)/dt,tg=clamp(Math.atan2(vy,Math.max(Math.abs(vx),30))*180/Math.PI,-85,85);e.a+=(tg-e.a)*Math.min(1,dt*10)}
   if(p>=1){e.act=null;e.vx=e.vy=0;if(e===P){OW.tx=clamp(e.x,e.w*.45,W-e.w*.45);OW.ty=clamp(e.y,yMin(e),yMax(e))}}
  }else{let tx,ty;
   if(e===P){if(OW.chase&&OW.chase.alive){tx=OW.chase.x;ty=OW.chase.y}else{tx=OW.tx;ty=OW.ty}}
   else{const k=e.kind==='mom'?1:1.8;tx=P.x-P.dir*P.w*.8*k;ty=P.y+(e.kind==='mom'?-P.h*.4:P.h*.5)+Math.sin(OW.time*1.3+k)*10}
   const maxS=W*(e===P?.55:.6),dx=tx-e.x,dy=ty-e.y,f=Math.min(1,dt*3);
   e.vx+=(clamp(dx*2.2,-maxS,maxS)-e.vx)*f;e.vy+=(clamp(dy*2.2,-maxS,maxS)-e.vy)*f;
   e.x=clamp(e.x+e.vx*dt,e.w*.4,W-e.w*.4);
   const ny=e.y+e.vy*dt;e.y=ny<yMin(e)?lerp(e.y,yMin(e),Math.min(1,dt*4)):Math.min(ny,yMax(e));
   if(e.vx>18)e.dir=1;else if(e.vx<-18)e.dir=-1;
   const tg=clamp(Math.atan2(e.vy,Math.max(Math.abs(e.vx),60))*180/Math.PI,-35,35);e.a+=(tg-e.a)*Math.min(1,dt*5)}
  const bob=e.act?0:Math.sin(OW.time*2+e.ph)*3,sq=e.sq||0;e.sq=sq*Math.pow(.004,dt);
  if(e===P){P.hurt=Math.max(0,(P.hurt||0)-dt);e.el.style.opacity=P.hurt>0&&Math.floor(P.hurt*12)%2?.35:1;e.el.style.filter=P.hurt>.9?'drop-shadow(0 0 10px #ff4d4d)':''}
  e.el.style.transform=`translate(${e.x-e.w/2}px,${e.y-e.h/2+bob}px) rotate(${e.a*e.dir}deg) scaleX(${e.dir}) scale(${1+sq*.2},${1-sq*.16})`}
 updShark(dt);
 const [hx,hy]=pt(P,P.w*.4,P.h*.05);
 if(OW.time-(OW.lastCatch||0)>18){OW.lastCatch=OW.time;adj('fish',-.08)}
 const fleeR=P.w*(.85+.6*sk('fish')),fleeMax=W*(.25+.2*sk('fish')),fTop=OW.surf+26,fBot=OW.H-BAR-18,ease6=Math.min(1,dt*6);
 for(const f of OW.fish){if(!f.alive)continue;
  const ax=f.x-P.x,ay=f.y-P.y,d=Math.hypot(ax,ay)||1;
  if(d<fleeR){const k=.6+.4*(1-d/fleeR),jig=Math.sin(OW.time*9+f.ph)*.45;
   const ux=ax/d-ay/d*jig,uy=ay/d+ax/d*jig;f.vx+=(ux*fleeMax*k-f.vx)*ease6;f.vy+=(uy*fleeMax*k-f.vy)*ease6;f.baseY=clamp(f.y,fTop,fBot);
   if(!f.fleeing){f.fleeing=true;if(Math.random()<.35)tone(1500,.06,'sine',.06,2100)}}
  else{f.fleeing=false;const sg=f.vx>=0?1:-1;f.vx+=(sg*f.cruise-f.vx)*Math.min(1,dt*1.5);f.vy+=((f.baseY-f.y)*.8-f.vy)*Math.min(1,dt*2);
   if(Math.random()<dt*.1)f.vx=-f.vx}
  f.x+=f.vx*dt;f.y+=f.vy*dt;
  if(f.x<20){f.x=20;f.vx=Math.abs(f.vx)}else if(f.x>W-20){f.x=W-20;f.vx=-Math.abs(f.vx)}
  if(f.y<fTop){f.y=fTop;f.vy=Math.abs(f.vy)}else if(f.y>fBot){f.y=fBot;f.vy=-Math.abs(f.vy)}
  if(Math.abs(f.vx)>5)f.dir=f.vx>0?1:-1;
  if(Math.hypot(f.x-hx,f.y-hy)<P.w*.27){eatFish(f);continue}
  const wob=f.fleeing?Math.sin(OW.time*30)*6:0;
  f.el.style.transform=`translate(${f.x-22}px,${f.y-14+Math.sin(OW.time*1.6+f.ph)*4}px) scaleX(${f.dir}) rotate(${wob}deg)`}
 requestAnimationFrame(oLoop)}

 if(!sh){if(!OW.P.act){OW.sharkWait-=dt;if(OW.sharkWait<=0){OW.sharkWait=28;spawnShark()}}return}

 const steer=(tx,ty,spd,f)=>{sh.vx+=(clamp((tx-sh.x)*2,-spd,spd)-sh.vx)*Math.min(1,dt*f);sh.vy+=(clamp((ty-sh.y)*2,-spd,spd)-sh.vy)*Math.min(1,dt*f)};
 if(sh.state==='enter'||sh.state==='hunt'){
  if(sh.state==='enter'&&sh.x>sh.w*.5&&sh.x<W-sh.w*.5)sh.state='hunt';
  let target=null,bd=1e9;OW.fish.forEach(f=>{if(!f.alive)return;const d=Math.hypot(f.x-sh.x,f.y-sh.y);if(d<bd){bd=d;target=f}});
  if(target){steer(target.x,target.y,W*.26,2)}else{if(sh.t%4<dt){sh.wx=W*(.2+Math.random()*.6);sh.wy=OW.surf+(OW.H-BAR-OW.surf)*(.2+Math.random()*.6)}steer(sh.wx,sh.wy,W*.2,1.5)}
  if(Math.abs(sh.vx)>15)sh.dir=sh.vx>0?1:-1;
  const [mx,my]=[sh.x+sh.dir*sh.w*.42,sh.y+sh.h*.08];
  if(target&&Math.hypot(target.x-mx,target.y-my)<sh.w*.2){target.alive=false;target.el.hidden=true;if(OW.chase===target)OW.chase=null;tone(160,.2,'square',.12,80);
   if(Math.random()<.6)say(rnd(['Hey! The shark took a fish!','Oh no, sneaky shark!']));setTimeout(()=>spawnFish(target,false),2500)}
  sh.atk-=dt;if(sh.state==='hunt'&&sh.atk<=0&&Math.hypot(OW.P.x-sh.x,OW.P.y-sh.y)<W*.8){sh.state='windup';sh.t=0;
   pow('GRR!',sh.x,sh.y-sh.h*.8,'grr');tone(90,.5,'square',.12,70);}
  bumpCheck(sh);
 }else if(sh.state==='windup'){const P=OW.P;sh.vx*=Math.pow(.05,dt);sh.vy*=Math.pow(.05,dt);sh.dir=P.x>sh.x?1:-1;spin=Math.sin(sh.t*40)*5;
  bumpCheck(sh);
  if(sh.state==='windup'&&sh.t>.5+.75*(1-sk('shark'))){const dx=P.x-sh.x,dy=P.y-sh.y,d=Math.hypot(dx,dy)||1,ls=W*(.62+.45*sk('shark'));sh.vx=dx/d*ls;sh.vy=dy/d*ls;sh.state='lunge';sh.t=0;sfx.whoosh()}}
 else if(sh.state==='lunge'){const P=OW.P;if(Math.abs(sh.vx)>15)sh.dir=sh.vx>0?1:-1;
  const mx=sh.x+sh.dir*sh.w*.42,my=sh.y+sh.h*.08;
  if(!(P.hurt>0)&&Math.hypot(mx-P.x,my-P.y)<P.w*.38)bite(sh);
  else if(sh.t>.8){sh.state='hunt';sh.t=0;sh.atk=2.2+3.2*(1-sk('shark'))+Math.random()*2}}
 else if(sh.state==='retreat'){const P=OW.P,dx=sh.x-P.x||1;sh.vx+=(Math.sign(dx)*W*.35-sh.vx)*Math.min(1,dt*4);sh.vy*=.95;sh.dir=sh.vx>0?1:-1;
  if(sh.t>1.1){sh.state='hunt';sh.t=0;sh.atk=2.2+3.2*(1-sk('shark'))+Math.random()*2}}
 else if(sh.state==='dizzy'){sh.vx*=Math.pow(.15,dt);sh.vy*=Math.pow(.15,dt);spin=Math.min(1,sh.t/.6)*360;
  if(sh.t>1.2){sh.state='hunt';sh.t=0}}
 else if(sh.state==='flip'){sh.vx*=Math.pow(.1,dt);sh.vy+=(OW.surf+(OW.H-BAR-OW.surf)*.35-sh.y)*dt;sh.flip=Math.min(1,sh.flip+dt*1.6);
  if(sh.flip>.6&&!sh.powFlip){sh.powFlip=1;pow('FLIP!',sh.x,sh.y-sh.h,'big');sparks(sh.x,sh.y,12,140);shake()}
  if(sh.t>1&&(sh.zt=(sh.zt||0)-dt)<0){sh.zt=.6;pow('z',sh.x+sh.dir*sh.w*.25,sh.y-sh.h*.2,'zz')}
  if(sh.t>.5&&!sh.saidFlip){sh.saidFlip=1;caption(FACTS.flip);say('Flip! '+FACTS.flip)}
  if(sh.t>4.2){sh.state='leave';sh.t=0;sh.dir=sh.x<W/2?-1:1}}
 else if(sh.state==='leave'){sh.flip=Math.max(0,sh.flip-dt*2);sh.vx=lerp(sh.vx,sh.dir*W*.9,Math.min(1,dt*2));sh.vy*=.95;
  if(sh.x<-sh.w||sh.x>W+sh.w){sh.el.remove();sh.st.remove();sh.hpEl.remove();sh.alive=false;OW.shark=null;OW.sharkWait=30;adj('shark',.1);collect('gwhite');
   sfx.tada();pow('ORCAS WIN!',OW.W/2,OW.H*.45,'big');sparks(OW.W/2,OW.H*.45,16,180);mbubs(OW.W/2,OW.H*.55,20,140);caption('Hooray! The orcas won!');say('Hooray! The orcas won!');
   OW.ents.forEach((e,i)=>setTimeout(()=>{if(!e.act){e.act=makeAct('jump',e);e.act.t=0}},i*400));
   setTimeout(()=>{caption(FACTS.win);say(FACTS.win)},2600);return}}
 sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
 if(sh.state!=='leave'&&sh.state!=='enter')sh.x=clamp(sh.x,sh.w*.3,W-sh.w*.3);
 sh.y=clamp(sh.y,yMinS,yMaxS);
 const tg=clamp(Math.atan2(sh.vy,Math.max(Math.abs(sh.vx),60))*180/Math.PI,-30,30);sh.a+=(tg-sh.a)*Math.min(1,dt*5);
 sh.el.style.transform=`translate(${sh.x-sh.w/2}px,${sh.y-sh.h/2}px) rotate(${(sh.a*sh.dir)+spin}deg) scaleX(${sh.dir}) scaleY(${1-2*sh.flip})`;
 sh.hpEl.style.left=sh.x+'px';sh.hpEl.style.top=(sh.y-sh.h*.85)+'px';sh.hpEl.hidden=sh.state==='flip'||sh.state==='leave';
 const dizzy=sh.state==='dizzy'||sh.state==='flip';sh.st.hidden=!dizzy;
 if(dizzy){sh.st.style.left=sh.x+'px';sh.st.style.top=(sh.y-sh.h*(sh.flip>.5?-.1:.75))+'px'}}

/* ============ PARENT SETTINGS ============ */
const PSET=[['sfx','Sound effects',[[true,'On'],[false,'Off']]],['music','Music',[[true,'On'],[false,'Off']]],['voice','Voice',[[true,'On'],[false,'Off']]],
 ['rate','Voice speed',[[.75,'Slow'],[.9,'Normal']]],['orcaName','Orca is called',[['Killer whale','Killer whale'],['Orca','Orca']]],
 ['level','Difficulty',[['auto','Auto'],['easy','Easy'],['normal','Normal'],['hard','Hard']]],['lock','Hold home button to leave a game',[[true,'On'],[false,'Off']]]];
function applySet(){NAMES.orca=SET.orcaName;if(!SET.music)clearInterval(musT)}
function drawParent(){$('prows').innerHTML=PSET.map(([k,label,opts])=>`<div class="prow"><span>${label}</span><div class="seg" data-k="${k}">${opts.map(([v,t],i)=>`<button data-i="${i}" class="${SET[k]===v?'on':''}">${t}</button>`).join('')}</div></div>`).join('')+
 `<div class="prow"><span>Sticker album (${ALBUM.size} of ${COLLECT.length})</span><button class="pbtn" id="preset">${drawParent.confirm?'Tap again to reset':'Reset album'}</button></div>`;
 $('prows').querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=sg.dataset.k,opt=PSET.find(x=>x[0]===k)[2][+b.dataset.i];SET[k]=opt[0];saveSet();applySet();sfx.ui();drawParent()}));
 $('preset').onclick=()=>{if(drawParent.confirm){ALBUM.clear();STORE.set('album',[]);drawParent.confirm=false}else drawParent.confirm=true;drawParent()};
 $('pver').textContent='Version '+APP_VERSION+'.'}
function openParent(){drawParent.confirm=false;drawParent();$('parent').hidden=false;sfx.ui()}
$('pdone').onclick=()=>{$('parent').hidden=true;startMusic(current)};
applySet();

/* ============ STICKER ALBUM ============ */
const COLLECT=[
 ['sea','orca','Killer whales live in families called pods.'],['sea','gwhite','Great white sharks have lots and lots of teeth.'],
 ['sea','hammer','Hammerhead sharks have eyes on the ends of their wide heads.'],['sea','ray','Stingrays glide through the water like birds.'],
 ['sea','octopus','An octopus has eight arms.'],['sea','crab','Crabs walk sideways!'],['sea','starfish','A starfish has five arms.'],['sea','fish','Fish breathe under water with gills.'],
 ['land','trex',DINO_INFO.trex],['land','longneck',DINO_INFO.longneck],['land','trike',DINO_INFO.trike],['land','stego',DINO_INFO.stego],
 ['land','ankylo',DINO_INFO.ankylo],['land','parasaur',DINO_INFO.parasaur],['land','spider','Spiders have eight legs and spin webs.'],
 ['land','snake','Snakes have no legs. They slither!'],['land','bibbi','Bibbi-Cat is the best snuggle bunny in the whole world!'],
 ['air','eagle','Eagles have super sharp eyes.'],['air','vulture','Vultures fly high in the sky and look for food.'],
 ['air','ptero','Pterodactyls could fly, but they were not birds.'],['air','bat','Bats sleep upside down!']].map(([h,k,f])=>({h,k,f}));
const ALB_COL={longneck:0,trex:1,trike:2,stego:3,parasaur:4,ankylo:5,snake:1,ptero:0};
function stickerArt(k){return k in ALB_COL?ART[k](...DINO_COLORS[ALB_COL[k]]):k==='fish'?ART.fish():ART[k]()}
const ALBUM=new Set(STORE.get('album',[]));
let toastT=0;
function collect(k){if(ALBUM.has(k)||!COLLECT.some(c=>c.k===k))return;ALBUM.add(k);STORE.set('album',[...ALBUM]);
 setTimeout(()=>{sfx.sticker();const t=$('toast');t.innerHTML=`<div>${stickerArt(k)}</div>New sticker!`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)},900)}
const HAB={sea:['Sea','<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#2aa5d4"/><path d="M3 17 Q8 12 13 17 T23 17 T29 17" stroke="#fff" stroke-width="3" fill="none"/></svg>'],
 land:['Land','<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#68c25e"/><path d="M15 6 L22 20 H8Z" fill="#2f7a38"/><rect x="13.5" y="19" width="3" height="5" fill="#6d4229"/></svg>'],
 air:['Sky','<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#86cff6"/><path d="M7 18 Q9 12 14 14 Q16 9 21 12 Q25 12 24 18Z" fill="#fff"/></svg>']};
function albumInit(){$('albCount').innerHTML=STAR+ALBUM.size+' / '+COLLECT.length;
 $('alb').innerHTML=['sea','land','air'].map(h=>`<h3>${HAB[h][1]}${HAB[h][0]}</h3><div class="alb-grid">${COLLECT.filter(c=>c.h===h).map(c=>`<div class="stk ${ALBUM.has(c.k)?'':'no'}" data-k="${c.k}"><div>${stickerArt(c.k)}</div></div>`).join('')}</div>`).join('');
 $('alb').querySelectorAll('.stk').forEach(el=>el.addEventListener('pointerdown',()=>{const c=COLLECT.find(x=>x.k===el.dataset.k);restart(el,'wig');
  if(ALBUM.has(c.k)){sfx.pop();say(NAMES[c.k]+'! '+c.f.replace(/^It's an? [^!]+! /,''))}else{sfx.boop();say('Not found yet! Keep playing to find it.')}}))}

/* ============ HINT HAND ============ */
let lastAct=performance.now(),handOn=false;
addEventListener('pointerdown',()=>{lastAct=performance.now();hideHand()},true);
function hideHand(){const h=$('hand');h.getAnimations().forEach(a=>a.cancel());h.style.opacity=0;handOn=false}
function ctr(el){const a=$('app').getBoundingClientRect(),r=el.getBoundingClientRect();return [r.left-a.left+r.width/2,r.top-a.top+r.height/2,r]}
function hintFor(id){try{
 if(id==='home')return{type:'tap',at:ctr(document.querySelector('.world.hero .disc'))};
 if(id==='egg'){if(!egg.hatched)return{type:'tap',at:ctr($('eggbox'))};const d=ctr($('dino'));
  if(egg.mood==='cry')return{type:'tap',at:d};if(!$('again').hidden&&Math.random()<.5)return{type:'tap',at:ctr($('again'))};
  return{type:'swipe',at:d,to:[d[0],d[1]-150]}}
 if(id==='hide'){const c=[...$('reef').querySelectorAll('.spot:not(.open):not(.matched)')];if(!c.length)return null;return{type:'tap',at:ctr(rnd(c))}}
 if(id==='feed'){if(fd.busy||!fd.cur)return null;const f=[...$('tray').querySelectorAll('.food')].find(f=>likes(fd.cur,f.dataset.k));if(!f)return null;
  const a=$('app').getBoundingClientRect(),[mx,my]=mouthPoint();return{type:'drag',at:ctr(f),to:[mx-a.left,my-a.top]}}
 if(id==='orca'){if(!OW.P)return null;const o=$('orca').getBoundingClientRect(),a=$('app').getBoundingClientRect(),off=[o.left-a.left,o.top-a.top];
  let t=OW.shark&&OW.shark.alive?OW.shark:null;if(!t){let bd=1e9;OW.fish.forEach(f=>{if(!f.alive)return;const d=Math.hypot(f.x-OW.P.x,f.y-OW.P.y);if(d<bd){bd=d;t=f}})}
  if(!t)return null;return{type:'drag',at:[OW.P.x+off[0],OW.P.y+off[1]],to:[t.x+off[0],t.y+off[1]]}}
}catch(e){}return null}
function showHand(g){const h=$('hand'),[x,y]=g.at,pos=(px,py,sc=1)=>`translate(${px-20}px,${py-2}px) scale(${sc})`;handOn=true;
 let kf,dur;
 if(g.type==='tap'){dur=1800;kf=[{opacity:0,transform:pos(x+30,y+40)},{opacity:1,transform:pos(x,y),offset:.25},{opacity:1,transform:pos(x,y,.82),offset:.35},{opacity:1,transform:pos(x,y),offset:.45},
  {opacity:1,transform:pos(x,y,.82),offset:.6},{opacity:1,transform:pos(x,y),offset:.7},{opacity:0,transform:pos(x,y),offset:1}];
  [630,1080].forEach(d=>setTimeout(()=>{if(handOn){const t=document.createElement('div');t.className='tapdot';t.style.left=x+'px';t.style.top=y+'px';$('app').appendChild(t);setTimeout(()=>t.remove(),950)}},d))}
 else{const [tx,ty]=g.to,fast=g.type==='swipe';dur=fast?1500:2200;kf=[{opacity:0,transform:pos(x+20,y+30)},{opacity:1,transform:pos(x,y),offset:.2},{opacity:1,transform:pos(x,y,.85),offset:.3},
  {opacity:1,transform:pos(tx,ty,.85),offset:fast?.55:.8},{opacity:0,transform:pos(tx,ty),offset:1}]}
 const a=h.animate(kf,{duration:dur,easing:'ease-in-out'});a.onfinish=()=>{h.style.opacity=0;handOn=false}}
setInterval(()=>{if(document.hidden||handOn||!$('parent').hidden||current==='album')return;if(performance.now()-lastAct>6500){const g=hintFor(current);lastAct=performance.now()-1500;if(g)showHand(g)}},500);

/* ============ ADAPTIVE DIFFICULTY ============ */
const SK=Object.assign({shark:.5,fish:.5,feed:.5},STORE.get('skill',{}));
function sk(n){return SET.level==='auto'?SK[n]:{easy:.12,normal:.5,hard:.88}[SET.level]}
function adj(n,d){if(SET.level!=='auto')return;SK[n]=Math.max(0,Math.min(1,SK[n]+d));STORE.set('skill',SK)}

try{speechSynthesis.getVoices()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
