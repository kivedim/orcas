<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Orcas &amp; Dinos</title>
<meta name="theme-color" content="#2bb3d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orcas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
/* Layout: one full-screen app, three "worlds" swapped in place. Single bright look by choice (toddler toy), not theme-aware. */
:root{
  --sky:#9fe3ff; --sea:#2bb3d8; --deep:#0c4f7e; --sand:#f3cf86;
  --leaf:#63c46a; --cream:#fff6e2; --ink:#22314d; --sun:#ffcf3f;
  --display:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden}
.art{display:block;width:100%;height:auto;overflow:visible}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:4px;border-radius:50%}

/* ---------- Home ---------- */
#home{background:linear-gradient(var(--sky) 0 26%,var(--sea) 26%,var(--deep) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#home .sun{position:absolute;top:4%;right:8%;width:16vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a88}
#home .wave{position:absolute;left:0;right:0;top:calc(26% - 3vmin);height:6vmin;
  background:radial-gradient(circle at 50% 0,var(--sky) 3vmin,transparent 3.1vmin) 0 0/6vmin 6vmin repeat-x}
#home h1{position:relative;margin:0;font-weight:800;font-size:clamp(34px,10vmin,72px);color:#fff;letter-spacing:.01em;
  text-shadow:0 4px 0 var(--deep);line-height:1}
.worlds{position:relative;display:flex;flex-direction:column;gap:2.4vh;align-items:center}
@media (orientation:landscape){.worlds{flex-direction:row;gap:5vw}}
.world{display:flex;flex-direction:column;align-items:center;gap:.6vh;color:#fff;font-weight:800;font-size:clamp(16px,3.4vmin,26px);
  text-shadow:0 2px 0 #0006}
[hidden]{display:none!important}
.row{display:flex;gap:3vw;align-items:flex-start}
.world .disc{width:min(23vw,15vh);aspect-ratio:1;border-radius:50%;background:var(--cream);border:1.4vmin solid #fff;
  box-shadow:0 1vmin 0 #0003;display:grid;place-items:center;transition:transform .15s}
.world:active .disc{transform:scale(.92)}
.world .disc > svg{width:72%}
.row .world:nth-child(1) .disc{background:#e6f7d9}
.row .world:nth-child(2) .disc{background:#d5f1fb}
.row .world:nth-child(3) .disc{background:#fff0d6}
.world.hero{font-size:clamp(20px,4.6vmin,32px)}
.world.hero .disc{width:min(56vw,28vh);background:#cdeefa;animation:pulse 2.4s infinite}
.world.hero .disc > svg{width:84%}
.mute{position:absolute;bottom:14px;right:max(14px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;
  background:#ffffff33;display:grid;place-items:center}
.mute svg{width:28px}

.homebtn{position:absolute;z-index:50;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:58px;height:58px;border-radius:50%;
  background:#fff;box-shadow:0 4px 0 #0002;display:grid;place-items:center}
.homebtn svg{width:32px}

/* ---------- Egg ---------- */
#egg{touch-action:none;background:linear-gradient(#bdf0ff 0,#dff8e2 45%,#9bdc8c 45%,#6cbb5f 100%)}
#egg .hill{position:absolute;bottom:52%;width:70%;aspect-ratio:2;border-radius:50% 50% 0 0;background:#8fd27c}
#egg .hill.a{left:-15%}#egg .hill.b{right:-20%;width:80%;background:#7cc86c}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,46vh);aspect-ratio:1}
.nest{position:absolute;left:0;right:0;bottom:0}
.eggbox{position:absolute;left:22%;width:56%;bottom:16%;transform-origin:50% 90%;touch-action:none}
.eggbox.wob{animation:wob .45s}
.crack{opacity:0;transition:opacity .1s}
.dino{position:absolute;left:4%;width:92%;bottom:14%;transform-origin:50% 100%}
.dino.pop{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
.dino.jump{animation:jump .55s}
.shell{pointer-events:none;position:absolute;left:50%;top:55%;width:16%;aspect-ratio:1;clip-path:polygon(50% 0,100% 100%,0 80%);
  animation:fly .9s ease-out forwards}
.again{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:19%;width:min(22vw,13vh);animation:pulse 1.2s infinite}
.shelf{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:2vw;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shelf > div{width:min(14vw,9vh);animation:popin .5s both}

/* ---------- Memory (hide & seek pairs) ---------- */
#hide .pow,#hide .spark,#hide .mbub{z-index:999}
#hide{isolation:isolate;background:linear-gradient(#86def6 0,#3fb3dc 24%,#1f86ba 40%,#1f86ba 100%)}
.ray{pointer-events:none;position:absolute;top:-10%;width:18%;height:62%;background:linear-gradient(#ffffff40,transparent);transform:rotate(18deg);transform-origin:top}
.bubble{pointer-events:none;position:absolute;bottom:-5%;z-index:60;border-radius:50%;border:2px solid #ffffffaa;background:#ffffff22;animation:rise linear infinite}
.floor{position:absolute;left:-15%;right:-15%;top:38%;bottom:-4%;pointer-events:none;border-radius:50% 50% 0 0/9% 9% 0 0;
  background:linear-gradient(#7fb8c2 0,#c9c08f 14%,#e7cd8c 45%,#f3d48c 100%)}
.floor::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 30% 4% at 30% 40%,#ffffff30,transparent),radial-gradient(ellipse 25% 3% at 70% 62%,#ffffff2a,transparent),radial-gradient(ellipse 34% 4% at 40% 84%,#ffffff26,transparent)}
.far{position:absolute;left:0;right:0;top:calc(38% - 64px);height:80px;pointer-events:none}
.swimmer{position:absolute;left:0;width:46px;opacity:.38;pointer-events:none;animation:swimby linear infinite}
.swimmer.rev{animation-name:swimback}
.spot{position:absolute;touch-action:none;cursor:pointer}
.spot::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:14%;border-radius:50%;background:radial-gradient(closest-side,#0000002e,transparent);z-index:0}
.spot .cover{position:absolute;inset:0;z-index:2;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1);
  filter:saturate(calc(.62 + .38 * var(--k,1))) brightness(calc(1.14 - .14 * var(--k,1)))}
.spot .cover.sway svg{transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
.spot .creature{position:absolute;left:8%;width:84%;bottom:22%;z-index:1;opacity:0;transform:translateY(20%) scale(.3);
  transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .18s;pointer-events:none}
.spot.open .creature{opacity:1;transform:translateY(-56%) scale(1)}
.spot.open .cover{transform:translateX(24%) rotate(10deg)}
.spot.matched .cover{transform:translateX(28%) rotate(13deg) scale(.92)}
.spot.matched .creature .bob{animation:bob 1.6s ease-in-out infinite}
.creature.wiggle .bob{animation:wiggle .5s !important}
.lvl{position:absolute;top:30px;right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:70}
.lvl i{width:16px;height:16px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
.lvl i.on{background:var(--sun)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swimby{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
@keyframes swimback{from{transform:translateX(calc(100vw + 80px)) scaleX(-1)}to{transform:translateX(-80px) scaleX(-1)}}

/* ---------- Feed ---------- */
#feed{transition:background .6s}
#feed.sea{background:linear-gradient(#8fe0f7,#2aa5d4 55%,#0f5d8f)}
#feed.land{background:linear-gradient(#c6f1ff,#e7f9df 52%,#98d887 52%,#6db95e)}
.animal{position:absolute;left:50%;top:44%;width:min(92vw,52vh);transform:translate(-50%,-50%);touch-action:none}
.animal .inner{transform-origin:50% 85%}
.animal.chomp .inner{animation:chomp .3s}
.animal.nope .inner{animation:nope .6s}
.animal.happy .inner{animation:jump .6s 2}
.animal.enter{animation:enter .7s cubic-bezier(.3,1.4,.5,1) both}
.animal.leave{animation:leave .5s ease-in both}
.yuckface{opacity:0}
.animal.yuck .yuckface{opacity:1}
.hearts{position:absolute;top:22px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.hearts svg{width:38px;transition:transform .3s}
.hearts svg.full{transform:scale(1.2)}
.tray{position:absolute;left:0;right:0;bottom:max(18px,3vh);z-index:5;display:flex;justify-content:center;gap:min(4vw,22px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.food{position:relative;width:min(27vw,16vh);aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:28%;
  box-shadow:0 6px 0 #0002;touch-action:none;cursor:grab;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.food > svg{width:80%;pointer-events:none}
.food.hint{animation:pulse .7s 4}
.pow.yuk{color:#9be15d}
.float{position:absolute;z-index:40;width:40px;pointer-events:none;animation:floatup 1.4s ease-out forwards}
@keyframes nope{15%{transform:rotate(-7deg) translateX(-5%)}35%{transform:rotate(6deg) translateX(5%)}55%{transform:rotate(-5deg) translateX(-3%)}75%{transform:rotate(3deg) translateX(2%)}}

/* ---------- Orca Ocean ---------- */
#orca{background:linear-gradient(#a9e2ff 0,#e6f7ff 30%,#3ab4dc 30%,#1574a6 62%,#0a3a60 100%);touch-action:none}
.o-sun{position:absolute;top:5%;left:12%;width:13vmin;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a77;pointer-events:none}
.o-mtn{position:absolute;left:-4%;width:64%;bottom:70%;pointer-events:none}
.o-berg{position:absolute;right:5%;width:min(30vw,210px);top:calc(30% - .4 * min(30vw,210px));pointer-events:none}
.o-waves{position:absolute;left:0;right:0;top:calc(30% - 1px);height:14px;pointer-events:none;
  background:radial-gradient(circle at 50% 0,#e6f7ff 9px,transparent 9.5px) 0 0/26px 14px repeat-x;animation:wave 4s linear infinite}
.o-ray{position:absolute;top:30%;width:14%;height:45%;background:linear-gradient(#ffffff38,transparent);transform:skewX(-14deg);pointer-events:none}
.o-floor{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none}
.orca-ent{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none}
.fishy{position:absolute;left:0;top:0;width:44px;pointer-events:none;will-change:transform}
.fishy.ping{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ffe066)}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:4px solid #ffffffcc;border-radius:50%;pointer-events:none;animation:ring 1s ease-out forwards}
.drop{position:absolute;width:13px;height:13px;margin:-6px;border-radius:50%;background:#effcff;pointer-events:none;animation:drop .9s ease-out forwards}
.puff{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;background:#fff;opacity:.95;pointer-events:none;animation:puff 1.3s ease-out forwards}
.o-actions{position:absolute;left:0;right:0;bottom:12px;z-index:20;display:flex;justify-content:center;gap:min(2vw,10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act{width:min(13.5vw,66px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0003;display:grid;place-items:center;transition:transform .12s}
.act:active{transform:scale(.88)}
.act svg{width:70%}
.o-count{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));z-index:20;display:flex;gap:3px}
.o-count div{width:34px;opacity:.35;transition:opacity .2s,transform .3s}
.o-count div.on{opacity:1;transform:scale(1.15)}
.caption{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(88%,520px);z-index:20;
  background:#ffffffeb;color:var(--ink);font-weight:600;font-size:clamp(15px,3.4vmin,20px);line-height:1.3;padding:8px 16px;border-radius:18px;
  text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
.caption.show{opacity:1}
.gw{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none}
.stars{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;animation:spin 1s linear infinite}
.stars svg{position:absolute;width:22px}
.act.shark{background:#ffe1e1}
.pow{position:absolute;z-index:15;pointer-events:none;font-family:var(--display);font-weight:800;line-height:1;white-space:nowrap;
  font-size:clamp(28px,8vmin,50px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:pow .95s ease-out forwards}
.pow.big{font-size:clamp(42px,12vmin,84px);color:#ffd93d;animation-duration:1.6s}
.pow.zz{font-size:clamp(20px,5vmin,30px);color:#cfe9ff;-webkit-text-stroke:4px var(--ink);animation:zz 1.4s ease-out forwards}
.boom{position:absolute;z-index:14;width:140px;height:140px;margin:-70px;pointer-events:none;animation:boom .55s ease-out forwards}
.spark{position:absolute;z-index:14;width:20px;margin:-10px;pointer-events:none;animation:spark .75s ease-out forwards}
.mbub{position:absolute;z-index:13;margin:-6px;border-radius:50%;border:2px solid #fff;background:#ffffff44;pointer-events:none;animation:mbub 1s ease-out forwards}
#oLayer.shake{animation:shake .38s}
.gw.flash{filter:brightness(2.4) saturate(.2)}
.o-count div.bump{animation:popin .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg)}55%{transform:translate(-50%,-65%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-115%) scale(.9);opacity:0}}
@keyframes zz{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(10%,-260%) scale(1.2) rotate(15deg);opacity:0}}
@keyframes boom{0%{transform:scale(.15) rotate(0);opacity:1}60%{opacity:1}100%{transform:scale(1.5) rotate(30deg);opacity:0}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
@keyframes mbub{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.shp{position:absolute;left:0;top:0;z-index:12;display:flex;gap:2px;transform:translate(-50%,-50%);pointer-events:none}
.shp svg{width:22px}
.shp.bump{animation:popin .4s cubic-bezier(.3,1.8,.5,1)}
.pow.grr{color:#ff5d5d;font-size:clamp(22px,6vmin,36px)}
.pow.ouch{color:#ff8fa3}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}
@keyframes drop{50%{transform:translate(calc(var(--dx) * .5),var(--dy))}100%{transform:translate(var(--dx),24px);opacity:0}}
@keyframes puff{to{transform:translate(var(--dx),-110px) scale(2.6);opacity:0}}
@keyframes wave{to{background-position-x:26px}}

#egg.shk{animation:shake .38s}
.dino .sadface,.dino .gladface{opacity:0;transition:opacity .12s}
.dino.sad .sadface,.dino.glad .gladface{opacity:1}
.tear{transform-box:fill-box;animation:tear 1s ease-in infinite}
.tear.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18%) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rise{to{transform:translateY(-115vh)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
@keyframes chomp{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.9)}}
@keyframes enter{from{transform:translate(80vw,-50%)}to{transform:translate(-50%,-50%)}}
@keyframes leave{to{transform:translate(-160vw,-50%)}}
@keyframes floatup{0%{transform:scale(.4);opacity:1}100%{transform:translateY(-30vh) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-iteration-count:1 !important;transition-duration:.01s !important}
 .world.hero .disc,.again,.o-waves,#oLayer.shake,#egg.shk,.tear,.stars,.spot.matched .creature .bob,.spot .cover.sway svg,.swimmer{animation:none !important}}
</style>
</head>
<body>

<div id="app">
  <!-- HOME -->
  <section class="screen" id="home">
    <div class="sun"></div><div class="wave"></div>
    <h1>Orcas &amp; Dinos</h1>
    <div class="worlds">
      <button class="world hero" data-go="orca" aria-label="Orca Ocean"><span class="disc" id="iconOrca"></span>Orca Ocean</button>
      <div class="row">
        <button class="world" data-go="egg" aria-label="Hatch the egg"><span class="disc" id="iconEgg"></span>Egg</button>
        <button class="world" data-go="hide" aria-label="Memory"><span class="disc" id="iconHide"></span>Memory</button>
        <button class="world" data-go="feed" aria-label="Feed the animals"><span class="disc" id="iconFeed"></span>Feed</button>
      </div>
    </div>
    <button class="mute" id="mute" aria-label="Sound on/off"></button>
  </section>

  <!-- EGG -->
  <section class="screen" id="egg" hidden>
    <div class="hill a"></div><div class="hill b"></div>
    <div class="stage">
      <div class="nest" id="nest"></div>
      <div class="eggbox" id="eggbox"></div>
      <div class="dino" id="dino" hidden></div>
    </div>
    <button class="again" id="again" hidden aria-label="New egg"></button>
    <div class="shelf" id="shelf"></div>
    <div class="caption" id="eggCap"></div>
  </section>

  <!-- MEMORY -->
  <section class="screen" id="hide" hidden>
    <div class="ray" style="left:8%"></div><div class="ray" style="left:46%;width:12%"></div><div class="ray" style="left:74%"></div>
    <div class="lvl" id="lvl"></div>
    <div id="reef"></div>
  </section>

  <!-- FEED -->
  <section class="screen sea" id="feed" hidden>
    <div class="animal" id="animal"><div class="inner" id="animalInner"></div></div>
    <div class="hearts" id="hearts"></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- ORCA OCEAN -->
  <section class="screen" id="orca" hidden>
    <div class="o-sun"></div>
    <svg class="o-mtn" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M0 70 L40 22 L62 40 L96 6 L130 44 L160 26 L200 70Z" fill="#9ccbe0"/><path d="M96 6 L82 24 L92 22 L100 28 L108 20Z M40 22 L33 31 L44 29Z" fill="#fff"/></svg>
    <svg class="o-berg" viewBox="0 0 200 160"><path d="M30 80 L60 34 L84 46 L110 10 L150 52 L172 80Z" fill="#fff"/><path d="M110 10 L104 80 L172 80 L150 52Z" fill="#dcf1fb"/><path d="M24 80 L176 80 L150 140 L60 150Z" fill="#cdeefa" opacity=".45"/></svg>
    <div class="o-ray" style="left:10%"></div><div class="o-ray" style="left:48%;width:9%"></div><div class="o-ray" style="left:76%"></div>
    <div class="o-waves"></div>
    <svg class="o-floor" viewBox="0 0 400 90" preserveAspectRatio="none">
      <path d="M0 50 Q60 36 120 48 T240 44 T400 46 V90 H0Z" fill="#d9b874"/>
      <g fill="#2f9a5b"><path d="M30 52 Q20 30 34 10 Q42 30 38 52Z"/><path d="M46 52 Q52 28 42 4 Q60 26 54 52Z"/><path d="M330 48 Q318 24 334 2 Q342 26 340 48Z"/><path d="M348 48 Q356 30 350 12 Q366 30 358 48Z"/></g>
      <ellipse cx="200" cy="54" rx="30" ry="12" fill="#7d84a6"/><ellipse cx="270" cy="56" rx="16" ry="8" fill="#8a7fa8"/>

function tone(f,d,type='sine',v=.25,f2){const a=audio();if(!a||muted)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}

 const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}

function oLoop(now){if(!OW.run)return;const dt=Math.min(.05,(now-OW.last)/1000);OW.last=now;OW.time+=dt;const P=OW.P,W=OW.W;
 for(const e of OW.ents){

  if(sh.state==='windup'&&sh.t>.75){const dx=P.x-sh.x,dy=P.y-sh.y,d=Math.hypot(dx,dy)||1;sh.vx=dx/d*W*.95;sh.vy=dy/d*W*.95;sh.state='lunge';sh.t=0;sfx.whoosh()}}
 else if(sh.state==='lunge'){const P=OW.P;if(Math.abs(sh.vx)>15)sh.dir=sh.vx>0?1:-1;
  const mx=sh.x+sh.dir*sh.w*.42,my=sh.y+sh.h*.08;
  if(!(P.hurt>0)&&Math.hypot(mx-P.x,my-P.y)<P.w*.38)bite(sh);
  else if(sh.t>.8){sh.state='hunt';sh.t=0;sh.atk=3+Math.random()*2}}
 else if(sh.state==='retreat'){const P=OW.P,dx=sh.x-P.x||1;sh.vx+=(Math.sign(dx)*W*.35-sh.vx)*Math.min(1,dt*4);sh.vy*=.95;sh.dir=sh.vx>0?1:-1;
  if(sh.t>1.1){sh.state='hunt';sh.t=0;sh.atk=3+Math.random()*2}}
 else if(sh.state==='dizzy'){sh.vx*=Math.pow(.15,dt);sh.vy*=Math.pow(.15,dt);spin=Math.min(1,sh.t/.6)*360;
  if(sh.t>1.2){sh.state='hunt';sh.t=0}}
 else if(sh.state==='flip'){sh.vx*=Math.pow(.1,dt);sh.vy+=(OW.surf+(OW.H-BAR-OW.surf)*.35-sh.y)*dt;sh.flip=Math.min(1,sh.flip+dt*1.6);
  if(sh.flip>.6&&!sh.powFlip){sh.powFlip=1;pow('FLIP!',sh.x,sh.y-sh.h,'big');sparks(sh.x,sh.y,12,140);shake()}
  if(sh.t>1&&(sh.zt=(sh.zt||0)-dt)<0){sh.zt=.6;pow('z',sh.x+sh.dir*sh.w*.25,sh.y-sh.h*.2,'zz')}
  if(sh.t>.5&&!sh.saidFlip){sh.saidFlip=1;caption(FACTS.flip);say('Flip! '+FACTS.flip)}
  if(sh.t>4.2){sh.state='leave';sh.t=0;sh.dir=sh.x<W/2?-1:1}}
 else if(sh.state==='leave'){sh.flip=Math.max(0,sh.flip-dt*2);sh.vx=lerp(sh.vx,sh.dir*W*.9,Math.min(1,dt*2));sh.vy*=.95;
  if(sh.x<-sh.w||sh.x>W+sh.w){sh.el.remove();sh.st.remove();sh.hpEl.remove();sh.alive=false;OW.shark=null;OW.sharkWait=30;
   sfx.tada();pow('ORCAS WIN!',OW.W/2,OW.H*.45,'big');sparks(OW.W/2,OW.H*.45,16,180);mbubs(OW.W/2,OW.H*.55,20,140);caption('Hooray! The orcas won!');say('Hooray! The orcas won!');
   OW.ents.forEach((e,i)=>setTimeout(()=>{if(!e.act){e.act=makeAct('jump',e);e.act.t=0}},i*400));
   setTimeout(()=>{caption(FACTS.win);say(FACTS.win)},2600);return}}
 sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
 if(sh.state!=='leave'&&sh.state!=='enter')sh.x=clamp(sh.x,sh.w*.3,W-sh.w*.3);
 sh.y=clamp(sh.y,yMinS,yMaxS);
 const tg=clamp(Math.atan2(sh.vy,Math.max(Math.abs(sh.vx),60))*180/Math.PI,-30,30);sh.a+=(tg-sh.a)*Math.min(1,dt*5);
 sh.el.style.transform=`translate(${sh.x-sh.w/2}px,${sh.y-sh.h/2}px) rotate(${(sh.a*sh.dir)+spin}deg) scaleX(${sh.dir}) scaleY(${1-2*sh.flip})`;
 sh.hpEl.style.left=sh.x+'px';sh.hpEl.style.top=(sh.y-sh.h*.85)+'px';sh.hpEl.hidden=sh.state==='flip'||sh.state==='leave';
 const dizzy=sh.state==='dizzy'||sh.state==='flip';sh.st.hidden=!dizzy;
 if(dizzy){sh.st.style.left=sh.x+'px';sh.st.style.top=(sh.y-sh.h*(sh.flip>.5?-.1:.75))+'px'}}

try{speechSynthesis.getVoices()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
